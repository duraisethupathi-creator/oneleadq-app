name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/floating-ai-assistant

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare direct APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OneLeadQ-Stage10-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneLeadQ-Android-APK
          path: OneLeadQ-Stage10-debug.apk
          compression-level: 0
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stage10-latest
          name: OneLeadQ Stage 10 Test APK
          prerelease: true
          make_latest: false
          files: OneLeadQ-Stage10-debug.apk
          overwrite_files: true
