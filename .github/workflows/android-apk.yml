name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/floating-ai-assistant

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Force production JS bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify JS bundle is packaged
        run: |
          unzip -l android/app/build/outputs/apk/release/app-release.apk | grep -E 'assets/index.android.bundle|index.android.bundle'
          unzip -p android/app/build/outputs/apk/release/app-release.apk assets/index.android.bundle | head -c 32 | grep -q . || (echo "Packaged JS bundle is empty" && exit 1)

      - name: Prepare direct APK
        run: cp android/app/build/outputs/apk/release/app-release.apk OneLeadQ-Stage10.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneLeadQ-Android-Standalone-APK
          path: OneLeadQ-Stage10.apk
          compression-level: 0
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stage10-latest
          name: OneLeadQ Stage 10 Standalone APK
          prerelease: true
          make_latest: false
          files: OneLeadQ-Stage10.apk
          overwrite_files: true
